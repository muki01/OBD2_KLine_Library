<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">OBD2 K-Line Library - Arduino and ESP32 library for K-Line vehicle diagnostics</title>
  <desc id="d">Banner showing an ISO 9141-2 request frame 68 6A F1 01 0C D0 for engine RPM with its header, mode, PID and checksum bytes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="40%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="100%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="480" rx="22"/></clipPath>
  </defs>
    <style>
      .glow{animation:hit 6s linear infinite}
      .ack{opacity:0;animation:hit 6s linear infinite}.b0 .glow{animation-delay:0s}.a0{animation-delay:0.45s}.b1 .glow{animation-delay:1s}.a1{animation-delay:1.45s}.b2 .glow{animation-delay:2s}.a2{animation-delay:2.45s}.b3 .glow{animation-delay:3s}.a3{animation-delay:3.45s}.b4 .glow{animation-delay:4s}.a4{animation-delay:4.45s}.b5 .glow{animation-delay:5s}.a5{animation-delay:5.45s}
      .scan{animation:scan 6s linear infinite}
      .live{animation:blink 1.6s ease-in-out infinite}
      .pin{animation:blink 1.6s ease-in-out infinite}
      .wave{animation:wave 3s ease-out infinite}
      .w2{animation-delay:.18s}.w3{animation-delay:.36s}
      .flow{animation:flow 1.2s linear infinite}
      @keyframes hit{0%{opacity:0}0.5%{opacity:1}15.0%{opacity:1}21.7%{opacity:0}100%{opacity:0}}
      @keyframes scan{from{transform:translateX(0)}to{transform:translateX(478px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes wave{0%{opacity:0}10%{opacity:1}45%{opacity:1}70%{opacity:0}100%{opacity:0}}
      @keyframes flow{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.glow,.ack,.scan,.live,.pin,.wave,.flow{animation:none}.scan{opacity:0}.ack{opacity:1}}
    </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#grid)"/>
    <rect width="1280" height="480" fill="url(#glow1)"/>
    <rect width="1280" height="480" fill="url(#glow2)"/>

    <!-- left column -->
    <text x="64" y="77" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" letter-spacing="2.9" fill="#22d3ee">ARDUINO LIBRARY</text>
    <text x="60" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="#f8fafc">OBD2 K-Line</text>
    <text x="60" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="url(#title)">Library</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#cbd5e1">
      <tspan x="64" y="272">Vehicle diagnostics over ISO 9141, KWP2000,</tspan>
      <tspan x="64" y="310">KW1281, DS2 and KW82 from your own sketch.</tspan>
    </text>
    <rect x="64" y="338" width="129" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="128.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">10.4 kbaud</text>
    <rect x="201" y="338" width="139" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="270.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">5-baud init</text>
    <rect x="348" y="338" width="119" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="407.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">fast init</text>
    <rect x="475" y="338" width="139" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="544.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">auto-detect</text>
    <text x="64" y="413" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#8a97ab">ISO 9141-2 · ISO 14230-4 · KW1281 · DS2 · KW82</text>

    <!-- right column: analyzer panel -->
    <g transform="translate(664 62)">
      <rect x=".5" y=".5" width="551" height="355" rx="20" fill="#0a101c" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".10"/>
      <circle class="live" cx="29" cy="30" r="5" fill="#34d399"/>
      <text x="44" y="35" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="1.5" fill="#94a3b8">K-LINE  LIVE</text>
      <text x="528" y="35" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#64748b">10400 8N1</text>
      <path d="M0 56H552" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24.0 72.0H38.2V140.0H46.2H54.1H62.0H69.9V72.0H77.9V140.0H85.8V72.0H93.7H101.6V140.0H109.6V72.0H117.5V140.0H125.4H133.3V72.0H141.3V140.0H149.2V72.0H157.1V140.0H165.0V72.0H173.0H180.9V140.0H188.8V72.0H196.7V140.0H204.7V72.0H212.6V140.0H220.5H228.4H236.4V72.0H244.3H252.2H260.1H268.1H276.0V140.0H283.9V72.0H291.9V140.0H299.8H307.7H315.6H323.6H331.5H339.4H347.3V72.0H355.3V140.0H363.2H371.1H379.0V72.0H387.0H394.9V140.0H402.8H410.7H418.7H426.6V72.0H434.5V140.0H442.4H450.4H458.3H466.2H474.1V72.0H482.1V140.0H490.0V72.0H497.9H505.8H513.8H528.0" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
      <rect class="scan" x="37" y="64" width="2" height="84" fill="#cffafe" opacity=".85"/>
      <g class="byte b0"><rect x="24" y="164" width="74" height="88" rx="12" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="24" y="164" width="74" height="88" rx="12" fill="#22d3ee" fill-opacity=".22" stroke="#22d3ee" stroke-width="2" opacity="0"/><text x="61" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">68</text><text x="61" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#22d3ee">FMT</text></g>
      <g class="byte b1"><rect x="110" y="164" width="74" height="88" rx="12" fill="#94a3b8" fill-opacity=".10" stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="110" y="164" width="74" height="88" rx="12" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8" stroke-width="2" opacity="0"/><text x="147" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">6A</text><text x="147" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#94a3b8">TGT</text></g>
      <g class="byte b2"><rect x="196" y="164" width="74" height="88" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="196" y="164" width="74" height="88" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="2" opacity="0"/><text x="233" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">F1</text><text x="233" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#34d399">SRC</text></g>
      <g class="byte b3"><rect x="282" y="164" width="74" height="88" rx="12" fill="#818cf8" fill-opacity=".10" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="282" y="164" width="74" height="88" rx="12" fill="#818cf8" fill-opacity=".22" stroke="#818cf8" stroke-width="2" opacity="0"/><text x="319" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">01</text><text x="319" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#818cf8">MODE</text></g>
      <g class="byte b4"><rect x="368" y="164" width="74" height="88" rx="12" fill="#c084fc" fill-opacity=".10" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="368" y="164" width="74" height="88" rx="12" fill="#c084fc" fill-opacity=".22" stroke="#c084fc" stroke-width="2" opacity="0"/><text x="405" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">0C</text><text x="405" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#c084fc">PID</text></g>
      <g class="byte b5"><rect x="454" y="164" width="74" height="88" rx="12" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="454" y="164" width="74" height="88" rx="12" fill="#f472b6" fill-opacity=".22" stroke="#f472b6" stroke-width="2" opacity="0"/><text x="491" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">D0</text><text x="491" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#f472b6">SUM</text></g>
      <path d="M0 298H552" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="24" y="334" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#e2e8f0">Request <tspan fill="#64748b">·</tspan> <tspan fill="#67e8f9">Engine RPM</tspan></text>
      <text x="528" y="334" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#34d399">checksum OK</text>
    </g>
  </g>
</svg>
