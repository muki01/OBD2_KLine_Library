paragraph=Simple and flexible K-Line library supporting ISO9141, ISO14230 (KWP2000), KW1281, DS2 and KW82. Handles the handshake, packet framing and checksums for you, and ships standard OBD2 diagnostics (live data, freeze frame, DTCs, vehicle info, supported PIDs). Works with HardwareSerial, SoftwareSerial, AltSoftSerial and custom pins.
